name: Deploy Kopela Exness Worker
on:
  push:
    branches: [feature/exness-trading-integration]
    paths:
      - "workers/exness/**"
      - ".github/workflows/deploy-exness-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kopela-exness-worker
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/exness
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-node@v4
        with:
          node-version: 22
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply kopela-exness-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
