name: Deploy Kopela to Cloudflare Pages
on:
  push:
    branches: [feature/exness-trading-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kopela-cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run Exness signing tests
        run: bun run test:exness
      - name: Build Kopela frontend
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://yndmvvndwqkfdxtocycv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=ai-forex-hub --branch=feature/exness-trading-integration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
